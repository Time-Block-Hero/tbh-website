<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>纸上群像 · Chibi 棋盘验收</title>
  <link rel="stylesheet" href="./chibi-review.css">
  <script src="./chibi-review-renderer.js" defer></script>
  <script src="./chibi-review.js" defer></script>
</head>
<body>
<header class="masthead"><a class="brand" href="./card-editor.html">TBH<span>ART DIRECTION / 02</span></a><nav><a href="./chibi-gallery.html">旧稿图集 ↗</a><span>本地美术验收</span></nav></header>
<main class="workspace">
  <aside class="library"><div class="library-heading"><p class="eyebrow">THE PAPER CAST</p><h1>纸上群像<span>Chibi 棋盘验收</span></h1><p id="coverage" class="coverage" role="status">正在读取单位目录…</p></div>
    <div class="filters"><input id="search" type="search" placeholder="搜索名称 / 编号" aria-label="搜索单位"><div><select id="faction" aria-label="职业筛选"><option value="">全部职业</option></select><select id="availability" aria-label="素材状态"><option value="">全部状态</option><option value="generated">新稿候选</option><option value="reviewed">已审阅</option><option value="pending">待重绘</option><option value="needs-fix">需修正</option></select></div></div>
    <div id="unitList" class="unit-list" aria-label="单位目录"></div><div id="resultCount" class="result-count"></div>
  </aside>
  <section class="review"><div class="review-title"><div><p class="eyebrow" id="identity">SKYBORNE ALLIANCE</p><h2 id="unitName">洛岚 <span>Luolan</span></h2></div><span id="status" class="status">等待载入</span></div>
    <div class="stage-wrap"><canvas id="stage" aria-label="可以旋转和缩放的三维棋盘，角色站在3乘3棋盘的中央格"></canvas><div class="stage-note"><span class="dot"></span>3 × 3 实体棋盘 <span>／</span> 单格 = 1</div><div id="stageError" role="alert" hidden></div><div class="stage-badges"><span id="activeLabel">当前单位</span><span id="baselineLabel">洛岚 · 黄金基准</span></div><div class="stage-help">拖拽旋转 · 滚轮缩放 · 双击复位</div><div class="view-controls"><button id="resetView" type="button">复位视角</button><button id="compare" type="button" aria-pressed="true">并排基准</button></div></div>
    <div class="director"><div id="actions" class="actions" role="group" aria-label="播放动作"><button data-action="idle" aria-pressed="true">待机</button><button data-action="move" aria-pressed="false">移动</button><button data-action="hit" aria-pressed="false">受伤</button><button data-action="attack" aria-pressed="false">攻击</button><button data-action="effect" aria-pressed="false">发动效果</button></div><div class="playback"><button id="play" type="button">暂停</button><button id="flip" type="button">朝向 ←</button><span id="frameInfo">帧 1 / 3</span><label class="scrubber"><span class="sr-only">动作逐帧</span><input id="frame" type="range" min="0" max="2" value="0" step="1"></label><button id="replay" type="button">重播</button></div></div>
    <div class="settings"><label>棋子高度 <output id="heightValue">1.10 格</output><input id="height" type="range" min="0.55" max="1.65" value="1.10" step="0.05"></label><label>纸片姿态<select id="orientation"><option value="billboard">朝向镜头</option><option value="tilted">固定倾角 · A</option></select></label><label>动作节奏<select id="speed"><option value="0.75">0.75 ×</option><option value="1" selected>1 ×</option><option value="1.5">1.5 ×</option></select></label><label class="check"><input id="motion" type="checkbox" checked>轻量动作位移</label></div>
    <div class="review-footer"><p id="provenance">正在载入…</p><p>色彩取自原稿；纸边与接地阴影在三维中呈现。所有单位共用尺寸和镜头，方便逐一对照。</p></div>
  </section>
</main>
</body></html>

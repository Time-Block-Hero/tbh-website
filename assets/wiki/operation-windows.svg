<text x="32" y="501" font-size="20" fill="#f2eee4" text-anchor="start">窗口内：先处理阶段开始效果；再执行该阶段允许的普通行动。</text>
<text x="32" y="539" font-size="20" fill="#f2eee4" text-anchor="start">本人声明完成后立即关闭窗口，不等待对方也完成才关闭。</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc"><title id="title">图 3-B 双人操作窗口时间轴</title><desc id="desc">时停与购买双方均有窗口；各自时动仅本人有窗口；回合开始、时停结束及回合结束双方都无窗口。自己的窗口外，效果选择由系统从合法选项中随机选取。</desc>

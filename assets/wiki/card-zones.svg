<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" role="img" aria-labelledby="title desc"><title id="title">图 2-B 卡牌区域状态迁移</title><desc id="desc">常规循环为牌堆抽入手牌、手牌放置至战场、弃牌进入弃牌堆、牌堆不足时回洗。图示仅画回合末法术从战场进入弃牌堆，不替代死亡或购买规则。移除进入虚空；资源拾取后本体消失，不进入虚空。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e6ad77"/></marker></defs>
<rect width="800" height="960" rx="16" fill="#141a17"/>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#f2eee4} .small{fill:#bfc9c0} .arrow{fill:none;stroke:#e6ad77;stroke-width:3;marker-end:url(#arrow);stroke-linejoin:round} .node{fill:#202e28;stroke:#738b7b;stroke-width:2}</style>
<text x="32" y="46" font-size="28" text-anchor="start">卡牌区域 · 状态迁移</text>
<text x="32" y="77" font-size="17" text-anchor="start" style="fill:#bfc9c0">连线表示指定行为；未画出的特殊转移依对应条款。</text>
<rect class="node" x="292" y="117" width="206" height="76" rx="12"/><text x="395.0" y="162.0" font-size="22" text-anchor="middle">牌堆</text>
<rect class="node" x="292" y="282" width="206" height="76" rx="12"/><text x="395.0" y="327.0" font-size="22" text-anchor="middle">手牌</text>
<rect class="node" x="292" y="471" width="206" height="76" rx="12"/><text x="395.0" y="516.0" font-size="22" text-anchor="middle">战场</text>
<rect class="node" x="34" y="282" width="196" height="76" rx="12"/><text x="132.0" y="327.0" font-size="22" text-anchor="middle">弃牌堆</text>
<rect class="node" x="574" y="282" width="192" height="76" rx="12"/><text x="670.0" y="313" font-size="22" text-anchor="middle">虚空</text><text x="670.0" y="338" font-size="16" text-anchor="middle" style="fill:#bfc9c0">仍是卡牌所在区域</text>
<path class="arrow" d="M395 193V282"/>
<text x="413" y="243" font-size="18" text-anchor="start">抽牌</text>
<path class="arrow" d="M395 358V471"/>
<text x="413" y="421" font-size="18" text-anchor="start">放置</text>
<path class="arrow" d="M292 320H230"/>
<text x="247" y="300" font-size="16" text-anchor="start">弃置</text>
<path class="arrow" d="M132 282V155H292"/>
<text x="148" y="211" font-size="17" text-anchor="start">牌堆不足时</text>
<text x="148" y="238" font-size="17" text-anchor="start">洗回后继续抽牌</text>
<path class="arrow" d="M292 509H132V358"/>
<text x="34" y="562" font-size="17" text-anchor="start">回合末法术清理</text>
<path class="arrow" d="M498 320H574"/>
<text x="526" y="280" font-size="17" text-anchor="middle">移除</text>
<text x="546" y="399" font-size="16" text-anchor="start" style="fill:#bfc9c0">此处以手牌被移除为例</text>
<path d="M32 601H768" stroke="#46584c"/>
<text x="32" y="639" font-size="23" text-anchor="start">战场上的资源：单独的终止分支</text>
<rect class="node" x="48" y="744" width="235" height="86" rx="12"/><text x="165.5" y="775" font-size="22" text-anchor="middle">场上资源</text><text x="165.5" y="800" font-size="16" text-anchor="middle" style="fill:#bfc9c0">未拾取就继续留场</text>
<rect class="node" x="516" y="744" width="236" height="86" rx="12"/><text x="634.0" y="775" font-size="22" text-anchor="middle">本体消失</text><text x="634.0" y="800" font-size="16" text-anchor="middle" style="fill:#bfc9c0">终止状态，不是存放区域</text>
<circle cx="728" cy="759" r="8" fill="#e6ad77"/><circle cx="728" cy="759" r="12" fill="none" stroke="#e6ad77"/>
<path class="arrow" d="M283 787H516"/>
<text x="399" y="725" font-size="18" text-anchor="middle">玩家触发拾取</text>
<text x="399" y="753" font-size="18" text-anchor="middle">收益结算完毕</text>
<path class="arrow" d="M85 744V690H247V744"/>
<text x="165" y="675" font-size="17" text-anchor="middle">回合结束：仍留场</text>
<text x="32" y="880" font-size="19" text-anchor="start">资源本体直接消失，只有效果结果留下，例如玩家增加的星能。</text>
<text x="32" y="915" font-size="19" text-anchor="start" style="fill:#e6ad77">有无拥有者都不进入虚空，也不回到卡组循环。</text>
</svg>